<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Key randomised trials in HPB surgical oncology for fellows and senior residents, tiered must know, good to know and nice to know. For education only.">
<meta name="theme-color" content="#0b6e6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HPB Trials">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="HPB Trials">
<meta property="og:description" content="Key randomised trials in HPB surgical oncology, tiered must know, good to know and nice to know. For education only.">
<meta property="og:url" content="https://basgkk.github.io/hpb-trials/">
<meta property="og:image" content="https://basgkk.github.io/hpb-trials/social-card.png">
<meta name="twitter:image" content="https://basgkk.github.io/hpb-trials/social-card.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:creator" content="@basgrootkoerkam">
<title>HPB Trials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column; home = scoreboard + category list; category = trials grouped by tier; trial = full-screen sheet. */
:root{
  --bg:#f3f5f7; --card:#ffffff; --ink:#12222e; --muted:#5b6b78; --line:#dde3e8;
  --accent:#0b6e6e; --accent-ink:#ffffff;
  --must:#b3261e; --good:#a86400; --nice:#3d5a80; --ok:#1c7c3c;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e161c; --card:#17222b; --ink:#e8eef2; --muted:#9aabb8; --line:#2a3944;
    --accent:#4fc3c3; --accent-ink:#06262a;
    --must:#ff8a80; --good:#f2b84b; --nice:#9db9e0; --ok:#6fd08c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e161c; --card:#17222b; --ink:#e8eef2; --muted:#9aabb8; --line:#2a3944;
  --accent:#4fc3c3; --accent-ink:#06262a;
  --must:#ff8a80; --good:#f2b84b; --nice:#9db9e0; --ok:#6fd08c; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:16px 16px 64px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:28px;font-weight:800;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}
h3{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;gap:12px;min-height:40px}
.back{font-weight:600;color:var(--accent);padding:8px 8px 8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.pad{padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
/* scoreboard */
.score{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center}
.big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px}
.tiers{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13.5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}
.t1{color:var(--must)} .t2{color:var(--good)} .t3{color:var(--nice)}
.b1{background:var(--must)} .b2{background:var(--good)} .b3{background:var(--nice)} .bo{background:var(--ok)}
/* search */
#q{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:13px 14px;border-top:1px solid var(--line);width:100%}
.item:first-child{border-top:0}
.item .name{font-weight:600}
.chev{color:var(--muted);font-size:18px}
.trial{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--line);align-items:flex-start}
.trial:first-child{border-top:0}
.trial .open{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.trial .name{font-weight:600}
.stripe{width:4px;align-self:stretch;border-radius:2px;flex:none}
.tick{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:transparent;margin-top:2px}
.tick.on{background:var(--ok);border-color:var(--ok);color:var(--card)}
.tag{font-size:11.5px;font-weight:600;border:1px solid currentColor;border-radius:999px;padding:1px 7px;white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:500}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:12px 16px;font-weight:600;text-align:center}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns>*{flex:1}
.link{color:var(--accent);text-decoration:underline;font-size:inherit;padding:0}
.note{border:1px solid var(--line);border-left:4px solid var(--good);border-radius:0 8px 8px 0;padding:10px 12px;background:var(--card)}
/* detail */
.sec{display:flex;flex-direction:column;gap:4px}
.sec h3{color:var(--muted)}
.bottom{border-left:4px solid var(--accent);padding:10px 12px;background:var(--bg);border-radius:0 8px 8px 0;font-weight:500}
/* quiz */
.opt{display:block;width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px}
.opt.right{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.wrong{border-color:var(--must);box-shadow:inset 0 0 0 1px var(--must)}
.foot{font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .3s}}
</style>
</head>
<body>
<div id="app"></div>
<script src="trials1.js"></script>
<script src="trials2.js"></script>
<script src="expert.js"></script>
<script>
(function(){
"use strict";
var CATS=[
 ["pn","Pancreatic cancer: resectable and borderline"],["pa","Pancreatic cancer: adjuvant"],
 ["pl","Pancreatic cancer: locally advanced"],["pm","Pancreatic cancer: metastatic"],
 ["ps","Pancreatic surgery: technique and perioperative care"],
 ["cr","Colorectal liver metastases"],["hc","Hepatocellular carcinoma"],["bt","Biliary tract cancer"],
 ["ls","Liver surgery: technique and perioperative care"],["tx","Transplant oncology"],
 ["ne","Neuroendocrine tumours"],["bd","Biliary drainage and palliation"]];
var TIER={1:"Must know",2:"Good to know",3:"Nice to know"};
var T=(window.TRIALS||[]).map(function(t){t.id=t.n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");return t;});
var byId={};T.forEach(function(t){byId[t.id]=t;});
var KEY="hpb-trials-v1",S={known:{},star:{},best:null};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);S.known=o.known||{};S.star=o.star||{};S.best=o.best||null;S.bestX=o.bestX||null;}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var app=document.getElementById("app");
var ui={tier:0,search:"",detail:null,practice:null,quiz:null};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function pct(a,b){return b?Math.round(100*a/b):0;}
function count(list){var k=0;list.forEach(function(t){if(S.known[t.id])k++;});return k;}
function route(){return (location.hash||"").replace(/^#/,"");}
function go(h){if(route()===h){render();}else{location.hash=h;}window.scrollTo(0,0);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}return a;}

function sub(t){var x=t.x;return x?esc(x[0])+': '+esc(lc(x[1]))+(x[2]?' vs '+esc(lc(x[2])):''):'';}
function lc(s){return /^[A-Z][a-z]/.test(s)?s.charAt(0).toLowerCase()+s.slice(1):s;}
var CN={NL:"Netherlands",US:"United States",GB:"United Kingdom",FR:"France",DE:"Germany",JP:"Japan",CN:"China",HK:"Hong Kong",IT:"Italy",KR:"South Korea",ES:"Spain",NO:"Norway",CA:"Canada",IN:"India",CH:"Switzerland",BE:"Belgium",FI:"Finland",SE:"Sweden",AT:"Austria",IL:"Israel"};
function flag(c){return c?String.fromCodePoint(127397+c.charCodeAt(0),127397+c.charCodeAt(1)):"";}
function trialRow(t){
  return '<div class="trial"><span class="stripe b'+t.t+'"></span>'+
   '<button class="open" data-open="'+t.id+'"><span class="row" style="gap:8px;flex-wrap:wrap"><span class="name">'+esc(t.n)+'</span>'+(t.f?'<span title="'+CN[t.f]+'" aria-label="'+CN[t.f]+'">'+flag(t.f)+'</span>':'')+
   '<span class="muted small num">'+(t.o?"ongoing":t.y)+'</span>'+(t.g&&t.g[1]&&/^ESMO/.test(t.g[0])?'<span class="tag" style="color:var(--accent)">ESMO '+esc(t.g[1])+'</span>':'')+(S.star[t.id]?'<span class="small" style="color:var(--good)">★</span>':'')+'</span>'+
   (sub(t)?'<span class="small">'+sub(t)+'</span>':'')+'<span class="small muted">'+esc(t.b)+'</span></button>'+
   '<button class="tick'+(S.known[t.id]?" on":"")+'" data-know="'+t.id+'" aria-label="I know this trial" aria-pressed="'+(!!S.known[t.id])+'">✓</button></div>';
}
function tierBlock(list){
  var h="";
  [1,2,3].forEach(function(k){
    if(ui.tier&&ui.tier!==k)return;
    var l=list.filter(function(t){return t.t===k;}).sort(function(a,b){return (a.o?1:0)-(b.o?1:0)||b.y-a.y;});
    if(!l.length)return;
    h+='<div class="stack" style="gap:6px"><h3 class="t'+k+'">'+TIER[k]+' <span class="num">· '+count(l)+'/'+l.length+'</span></h3><div class="card list">'+l.map(trialRow).join("")+'</div></div>';
  });
  return h||'<p class="muted">No trials match.</p>';
}
function chips(){
  var h='<div class="chips">';
  [[0,"All"],[1,"Must know"],[2,"Good to know"],[3,"Nice to know"]].forEach(function(c){
    h+='<button class="chip'+(ui.tier===c[0]?" on":"")+'" data-tier="'+c[0]+'">'+c[1]+'</button>';});
  return h+'</div>';
}
function home(){
  var known=count(T),h='<div class="top"><h1 class="grow">HPB Trials</h1><button class="back" data-go="about">About</button></div>'+
  '<p class="muted">The randomised trials every HPB fellow should know. Read the bottom line here, then read the paper.</p>'+
  '<p class="small muted">For education only, not for patient care. <button class="link" data-go="about">Read the disclaimer</button></p>';
  h+='<div class="card pad stack"><div class="score"><div class="big num">'+known+'<span class="muted" style="font-size:18px">/'+T.length+'</span></div>'+
     '<div class="stack" style="gap:4px"><span class="small muted">trials you know</span><div class="bar"><i class="bo" style="width:'+pct(known,T.length)+'%"></i></div></div></div><div class="tiers">';
  [1,2,3].forEach(function(k){var l=T.filter(function(t){return t.t===k;}),c=count(l);
    h+='<span><span class="dot b'+k+'"></span>'+TIER[k]+'</span><div class="bar"><i class="b'+k+'" style="width:'+pct(c,l.length)+'%"></i></div><span class="num">'+c+'/'+l.length+'</span>';});
  h+='</div>'+(S.best?'<p class="small muted">Best assessment score: <b class="num">'+S.best.s+'/'+S.best.n+'</b></p>':'')+
     (S.bestX?'<p class="small muted">Best expert score: <b class="num">'+S.bestX.s+'/'+S.bestX.n+'</b></p>':'')+
     '<div class="btns"><button class="btn" data-go="quiz">20-question assessment</button><button class="btn" data-go="expert">Expert quiz: the numbers</button></div>'+
     '<div class="btns"><button class="btn ghost" data-go="starred">Starred trials</button></div></div>';
  h+='<input id="q" type="search" placeholder="Search trial, drug or topic" value="'+esc(ui.search)+'" autocomplete="off">';
  h+='<div id="results">'+homeList()+'</div>';
  h+='<p class="foot">For educational purposes only; not medical advice. For patient care, use the current guidelines and the original publications. <button class="link" data-go="about">About, disclaimer and conflicts of interest</button></p>';
  return h;
}
function homeList(){
  var s=ui.search.trim().toLowerCase();
  if(s){
    var l=T.filter(function(t){return (t.n+" "+t.q+" "+t.b+" "+t.ref+" "+t.d).toLowerCase().indexOf(s)>=0;});
    return '<div class="stack"><p class="small muted num">'+l.length+' trials</p>'+(l.length?'<div class="card list">'+l.map(trialRow).join("")+'</div>':'')+'</div>';
  }
  var h='<div class="card list">';
  CATS.forEach(function(c){var l=T.filter(function(t){return t.c===c[0];}),m=l.filter(function(t){return t.t===1;});
    h+='<button class="item" data-go="'+c[0]+'"><span class="grow"><span class="name">'+c[1]+'</span><br><span class="small muted num">'+l.length+' trials · '+m.length+' must know · '+count(l)+' known</span>'+
       '<div class="bar" style="margin-top:6px"><i class="bo" style="width:'+pct(count(l),l.length)+'%"></i></div></span><span class="chev">›</span></button>';});
  return h+'</div>';
}
function category(id,name,list){
  var left=list.filter(function(t){return !S.known[t.id]&&!t.o;}).length;
  return '<div class="top"><button class="back" data-go="">‹ All topics</button></div><h2>'+esc(name)+'</h2>'+
   '<p class="small muted num">'+count(list)+' of '+list.length+' known</p>'+
   (list.length?'<div class="btns"><button class="btn" data-practice="'+id+'">'+(left?'Test myself ('+left+' to go)':'Test myself again')+'</button></div>':'')+
   chips()+tierBlock(list);
}
function guide(t){var g=t.g;if(!g)return '';
  return '<div class="sec"><h3>Guideline</h3><p>'+esc(g[3])+'</p><div class="row" style="gap:8px;flex-wrap:wrap">'+
   (g[1]?'<span class="tag" style="color:var(--accent)">'+(/^ESMO/.test(g[0])?'Level '+esc(g[1].split(", ")[0])+', grade '+esc(g[1].split(", ")[1]):'Evidence '+esc(g[1].split(", ")[0]).toLowerCase()+', '+esc(g[1].split(", ")[1]).toLowerCase()+' recommendation')+'</span>':'')+
   (g[2]?'<span class="tag" style="color:var(--accent)">ESMO-MCBS '+esc(g[2])+'</span>':'')+'<span class="small muted">'+esc(g[0])+'</span></div></div>';}
function sec(title,text){return text?'<div class="sec"><h3>'+title+'</h3><p>'+esc(text)+'</p></div>':'';}
function pmUrl(t){
  var base="https://pubmed.ncbi.nlm.nih.gov/";
  if(t.p&&/^\d+$/.test(t.p)){return base+t.p+"/";}
  var first=t.ref.split(";")[0];
  var congress=/ASCO|ESMO|UEG|ENETS|Unpublished|meeting|Week/i.test(first);
  var jm=null,re=/([A-Z][A-Za-z]*(?: [A-Z][A-Za-z]*)*) ((?:19|20)\d\d)\b/g,x;
  var after=first.slice(first.indexOf(",")+1);
  while((x=re.exec(after))!==null){jm=x;}
  if(jm&&!congress&&first.indexOf(",")>0){
    var au=first.split(",")[0].replace(/\(.*?\)/g,"").split(/&| and /)[0].trim();var y=+jm[2];
    var q=au+"[au] AND "+jm[1]+"[ta] AND ("+(y-1)+":"+(y+1)+"[dp]) AND (random*[tiab] OR trial[tiab] OR randomized controlled trial[pt])";
    return base+"?term="+encodeURIComponent(q);}
  var nct=t.ref.match(/NCT\d{8}/);if(nct){return "https://clinicaltrials.gov/study/"+nct[0];}
  return base+"?term="+encodeURIComponent(t.p||(t.n.replace(/\(.*?\)/g,"")+" randomized"));
}
function pmMore(t){
  if(!t.lt)return [];
  return t.lt.map(function(l){return {label:l[0],url:/^\d+$/.test(l[1])?"https://pubmed.ncbi.nlm.nih.gov/"+l[1]+"/":"https://pubmed.ncbi.nlm.nih.gov/?term="+encodeURIComponent(l[1])};});
}
function isLong(l){return /long|final|year|survival|update/i.test(l);}
function detail(t,hide){
  var cat=CATS.filter(function(c){return c[0]===t.c;})[0][1];
  var url=pmUrl(t);
  var h='<div class="row" style="gap:8px;flex-wrap:wrap"><span class="tag t'+t.t+'">'+TIER[t.t]+'</span>'+(t.o?'<span class="tag muted">Ongoing</span>':'')+
        (t.v?'<span class="tag" style="color:var(--ok)">Numbers verified</span>':'')+(pmMore(t).some(function(l){return isLong(l.label);})?'<span class="tag" style="color:var(--ok)">Long-term results</span>':'')+(t.nc?'<span class="tag" style="color:var(--good)">Non-comparative design</span>':'')+(t.f?'<span class="small muted">'+flag(t.f)+' Led from '+(t.f==="NL"||t.f==="US"||t.f==="GB"?"the ":"")+CN[t.f]+'</span>':'')+'</div>'+
        '<h2>'+esc(t.n)+'</h2>'+(sub(t)?'<p style="font-weight:500">'+sub(t)+'</p>':'')+'<p class="small muted">'+esc(cat)+' · '+esc(t.ref)+'</p>';
  if(hide){return h+'<p>What did this trial show?</p><button class="btn" data-reveal="1">Show the answer</button>';}
  h+=sec("Question",t.q);
  h+=sec("Design",t.d)+sec("Result",t.r)+'<div class="sec"><h3>Bottom line</h3><p class="bottom">'+esc(t.b)+'</p></div>'+sec("Keep in mind",t.k)+guide(t)+
     '<p><a href="'+url+'" target="_blank" rel="noopener">'+(url.indexOf("clinicaltrials.gov")>0?"See the trial on ClinicalTrials.gov":t.pl?"Find the "+esc(t.pl)+" on PubMed":(pmMore(t).length?"Find the first report on PubMed":"Find the paper on PubMed"))+'</a></p>'+pmMore(t).map(function(l){return '<p><a href="'+l.url+'" target="_blank" rel="noopener">Find the '+esc(l.label)+' on PubMed</a>'+(isLong(l.label)?' <span class="tag" style="color:var(--ok)">Long-term results</span>':'')+'</p>';}).join('')+(t.g&&t.g[4]?'<p><a href="'+t.g[4]+'" target="_blank" rel="noopener">Open the '+esc(t.g[0])+'</a></p>':'');
  return h;
}
function sheet(){
  var t=byId[ui.detail];
  return '<div class="top"><button class="back" data-close="1">‹ Back</button></div><div class="card pad stack">'+detail(t,false)+'</div>'+
   '<div class="btns"><button class="btn'+(S.known[t.id]?"":" ghost")+'" data-know="'+t.id+'">'+(S.known[t.id]?"✓ I know this trial":"Mark as known")+'</button>'+
   '<button class="btn ghost" data-star="'+t.id+'">'+(S.star[t.id]?"★ Starred":"☆ Star")+'</button></div>';
}
function practice(){
  var p=ui.practice;
  if(p.i>=p.ids.length){
    return '<div class="top"><button class="back" data-endpractice="1">‹ Back</button></div><div class="card pad stack"><h2>Round finished</h2>'+
     '<p>You knew <b class="num">'+p.yes+' of '+p.ids.length+'</b> trials in this round.</p><button class="btn" data-endpractice="1">Back to the list</button></div>';
  }
  var t=byId[p.ids[p.i]];
  return '<div class="top"><button class="back" data-endpractice="1">‹ Stop</button><span class="small muted num grow" style="text-align:right">'+(p.i+1)+' / '+p.ids.length+'</span></div>'+
   '<div class="card pad stack">'+detail(t,!p.shown)+'</div>'+
   (p.shown?'<div class="btns"><button class="btn" data-rate="1">I knew it</button><button class="btn ghost" data-rate="0">Not yet</button></div>':'');
}
function makeQuiz(){
  var pool=T.filter(function(t){return t.pq||(t.x&&t.x[4]);});
  var pick=shuffle(pool.filter(function(t){return t.t===1;})).slice(0,14).concat(shuffle(pool.filter(function(t){return t.t===2;})).slice(0,6));
  return {i:0,score:0,ans:null,wrong:[],qs:shuffle(pick).map(function(t){
    var x=t.x,opts;
    if(t.pq){return {id:t.id,pq:1,opts:shuffle(t.pq.map(function(s,k){return {text:s,ok:k===0};}))};}
    if(x[4]==="x"){opts=shuffle(x[5].map(function(s,k){return {text:s,ok:k===0};}));}
    else if(/non-inferiority/.test(x[3])){opts=[{text:"Non-inferiority was shown",ok:x[4]==="0"},{text:"Non-inferiority was not shown",ok:false},{text:"Superiority of "+lc(x[1])+" was shown",ok:x[4]==="a"}];}
    else{opts=[{text:"Significantly better with "+lc(x[1]),ok:x[4]==="a"},{text:"No significant difference",ok:x[4]==="0"},{text:"Significantly better with "+lc(x[2]),ok:x[4]==="b"}];}
    return {id:t.id,end:x[3],opts:opts};
  })};
}
function quiz(){
  var z=ui.quiz;if(!z){z=ui.quiz=makeQuiz();}
  if(z.i>=z.qs.length){
    var h='<div class="top"><button class="back" data-go="">‹ All topics</button></div><div class="card pad stack"><h2>Assessment result</h2>'+
     '<div class="big num">'+z.score+'<span class="muted" style="font-size:18px">/'+z.qs.length+'</span></div>'+
     '<p class="muted small">'+(z.score>=17?"Strong. Move on to the good-to-know trials.":z.score>=12?"Solid base. Review the trials below.":"Start with the must-know trials in each topic.")+'</p>'+
     '<button class="btn" data-newquiz="1">New assessment</button></div>';
    if(z.wrong.length){h+='<h3 class="muted">Read these again</h3><div class="card list">'+z.wrong.map(function(id){return trialRow(byId[id]);}).join("")+'</div>';}
    return h;
  }
  var q=z.qs[z.i],t=byId[q.id],done=z.ans!==null,h2='<div class="top"><button class="back" data-go="">‹ Stop</button><span class="small muted num grow" style="text-align:right">Question '+(z.i+1)+' / '+z.qs.length+'</span></div>'+
   '<div class="stack"><h2>'+esc(t.n)+'</h2><p style="font-weight:500">'+sub(t)+'</p><p class="muted">'+(q.pq?'What did the trial show, and what follows for practice?':'Endpoint: '+esc(q.end)+'. What did the trial show?')+'</p>';
  q.opts.forEach(function(o,k){
    var cls="opt";if(done){if(o.ok)cls+=" right";else if(+z.ans===k)cls+=" wrong";}
    h2+='<button class="'+cls+'" data-ans="'+k+'"'+(done?" disabled":"")+'>'+esc(o.text)+'</button>';});
  if(done){var ok=q.opts[+z.ans].ok;h2+='<p class="small" style="color:var(--'+(ok?"ok":"must")+')">'+(ok?"Correct.":"Not correct.")+'</p><p class="small">'+esc(t.r)+'</p><p class="bottom">'+esc(t.b)+'</p>'+
    '<div class="btns"><button class="btn" data-next="1">'+(z.i+1<z.qs.length?"Next question":"See result")+'</button><button class="btn ghost" data-open="'+q.id+'">Open trial</button></div>';}
  return h2+'</div>';
}
function makeX(){
  var pool=shuffle((window.EXPERT||[]).filter(function(e){return byId[idOf(e.n)];}));
  var seen={},pick=[];pool.forEach(function(e){if(pick.length<15&&!seen[e.n]){seen[e.n]=1;pick.push(e);}});
  return {i:0,score:0,ans:null,wrong:[],qs:pick.map(function(e){return {id:idOf(e.n),q:e.q,s:e.s,m:e.m,opts:shuffle(e.o.map(function(t,k){return {text:t,ok:k===0};}))};})};
}
function idOf(n){return n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}
function expert(){
  var z=ui.xq;if(!z){z=ui.xq=makeX();}
  if(z.i>=z.qs.length){
    var h='<div class="top"><button class="back" data-go="">‹ All topics</button></div><div class="card pad stack"><h2>Expert quiz result</h2>'+
     '<div class="big num">'+z.score+'<span class="muted" style="font-size:18px">/'+z.qs.length+'</span></div>'+
     '<p class="muted small">'+(z.score>=12?"You know the numbers well enough to quote them to patients.":z.score>=8?"Good grasp of direction; sharpen the absolute numbers below.":"Reread the results of the trials below before your next clinic.")+'</p>'+
     '<button class="btn" data-newx="1">New expert quiz</button></div>';
    if(z.wrong.length){h+='<h3 class="muted">Learn these numbers</h3><div class="card list">'+z.wrong.map(function(id){return trialRow(byId[id]);}).join("")+'</div>';}
    return h;
  }
  var q=z.qs[z.i],t=byId[q.id],done=z.ans!==null,h2='<div class="top"><button class="back" data-go="">‹ Stop</button><span class="small muted num grow" style="text-align:right">Expert question '+(z.i+1)+' / '+z.qs.length+'</span></div>'+
   '<div class="stack"><h2>'+esc(t.n)+'</h2><p style="font-weight:500">'+sub(t)+'</p><p>'+esc(q.q.replace(/^[^:]{2,40}: /,''))+'</p>';
  q.opts.forEach(function(o,k){
    var cls="opt";if(done){if(o.ok)cls+=" right";else if(+z.ans===k)cls+=" wrong";}
    h2+='<button class="'+cls+'" data-xans="'+k+'"'+(done?" disabled":"")+'>'+esc(o.text)+'</button>';});
  if(done){var ok=q.opts[+z.ans].ok;h2+='<p class="small" style="color:var(--'+(ok?"ok":"must")+')">'+(ok?"Correct.":"Not correct.")+'</p>'+
    '<div class="sec"><h3>For the conversation with your patient</h3><p class="bottom">'+esc(q.s)+'</p></div>'+(q.m?'<div class="sec"><h3>Methods point</h3><p class="bottom">'+esc(q.m)+'</p></div>':'')+'<p class="small muted">'+esc(t.r)+'</p>'+
    '<div class="btns"><button class="btn" data-xnext="1">'+(z.i+1<z.qs.length?"Next question":"See result")+'</button><button class="btn ghost" data-open="'+q.id+'">Open trial</button></div>';}
  return h2+'</div>';
}
function about(){
  return '<div class="top"><button class="back" data-go="">‹ All topics</button></div><div class="card pad stack">'+
  '<h2>About HPB Trials</h2>'+
  '<p>Curated by <b>Bas Groot Koerkamp</b>, MD, PhD, HPB surgical oncologist and epidemiologist, Erasmus MC, Rotterdam, the Netherlands.</p>'+
  '<p>A free starting point for HPB surgical oncology fellows and senior residents: which randomised trials to read first, ranked must know, good to know and nice to know, with the design, the main result, the bottom line and the guideline position.</p>'+
  '<div class="note stack" style="gap:6px"><h3>Disclaimer</h3><p>For educational purposes only. This app is not medical advice and does not replace clinical judgement. Summaries are simplified and can contain errors. For patient care, use the current guidelines and the original publications. The curator accepts no liability for decisions based on this app.</p></div>'+
  '<div class="sec"><h3>How the content was made</h3><p>Trial summaries were drafted with AI assistance (Claude, Anthropic). Cards marked "Numbers verified" had their design and results compared with the PubMed abstract, the published paper or, for unpublished trials, the congress presentation; the bottom lines, notes and tiers are the curator’s interpretation. Guideline recommendations are paraphrased. Hazard ratios marked "calculated for this app" were reconstructed from published Kaplan-Meier curves and were not reported by the authors.</p></div>'+
  '<div class="sec"><h3>Grading</h3><p>ESMO levels of evidence run from I (randomised trials) to V, and grades of recommendation from A (strongly recommended) to E (never recommended). ESMO-MCBS scores the magnitude of clinical benefit of a drug. Surgical guidelines (Brescia, ERAS) report the certainty of evidence and the strength of the recommendation.</p></div>'+
  '<div class="sec"><h3>Conflicts of interest</h3><p>The curator is an investigator in several included trials, among them PREOPANC-2, PREOPANC-3, PUMP, TESLA and ENDURO. Disclosures: Tricumed (in-kind contribution to HAIP trials), Boston Scientific (speaker), Revolution Medicines (advisory board).</p></div>'+
  '<div class="sec"><h3>Corrections</h3><p>Spotted an error or a missing trial? Message <a href="https://x.com/basgrootkoerkam" target="_blank" rel="noopener">@basgrootkoerkam</a> on X.</p></div>'+
  '<p class="small muted">Version of 27 November 2026, '+T.length+' trials. Your progress is stored on this device only. Visits are counted anonymously with GoatCounter, without cookies or personal data.</p></div>';
}
function render(){
  var r=route(),h;
  if(ui.detail&&byId[ui.detail]){h=sheet();}
  else if(ui.practice){h=practice();}
  else if(r==="quiz"){h=quiz();}
  else if(r==="expert"){h=expert();}
  else if(r==="about"){h=about();}
  else if(r==="starred"){h=category("starred","Starred trials",T.filter(function(t){return S.star[t.id];}));}
  else{
    var c=CATS.filter(function(x){return x[0]===r;})[0];
    h=c?category(c[0],c[1],T.filter(function(t){return t.c===c[0];})):home();
  }
  app.innerHTML=h;
}
app.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var d=b.dataset;
  if("go" in d){ui.detail=null;ui.practice=null;ui.tier=0;if(d.go!=="quiz")ui.quiz=null;if(d.go!=="expert")ui.xq=null;go(d.go);return;}
  if(d.open){ui.detailY=window.scrollY;ui.detail=d.open;render();window.scrollTo(0,0);return;}
  if(d.close){ui.detail=null;render();window.scrollTo(0,ui.detailY||0);return;}
  if(d.know){if(S.known[d.know])delete S.known[d.know];else S.known[d.know]=1;save();var y=window.scrollY;render();window.scrollTo(0,y);return;}
  if(d.star){if(S.star[d.star])delete S.star[d.star];else S.star[d.star]=1;save();render();return;}
  if(d.tier!==undefined){ui.tier=+d.tier;render();return;}
  if(d.practice){
    var l=(d.practice==="starred"?T.filter(function(t){return S.star[t.id];}):T.filter(function(t){return t.c===d.practice;})).filter(function(t){return !t.o;});
    var todo=l.filter(function(t){return !S.known[t.id];});if(!todo.length)todo=l;
    todo.sort(function(a,b2){return a.t-b2.t;});
    ui.practice={ids:todo.map(function(t){return t.id;}),i:0,yes:0,shown:false};render();window.scrollTo(0,0);return;}
  if(d.reveal){ui.practice.shown=true;render();return;}
  if(d.rate!==undefined){var p=ui.practice,id=p.ids[p.i];if(d.rate==="1"){S.known[id]=1;p.yes++;}else{delete S.known[id];}save();p.i++;p.shown=false;render();window.scrollTo(0,0);return;}
  if(d.endpractice){ui.practice=null;render();return;}
  if(d.ans!==undefined){var z=ui.quiz,q=z.qs[z.i];z.ans=d.ans;if(q.opts[+d.ans].ok)z.score++;else z.wrong.push(q.id);render();return;}
  if(d.next){var z2=ui.quiz;z2.i++;z2.ans=null;if(z2.i>=z2.qs.length&&(!S.best||z2.score>S.best.s)){S.best={s:z2.score,n:z2.qs.length};save();}render();window.scrollTo(0,0);return;}
  if(d.newquiz){ui.quiz=null;render();window.scrollTo(0,0);return;}
  if(d.xans!==undefined){var x=ui.xq,xq=x.qs[x.i];x.ans=d.xans;if(xq.opts[+d.xans].ok)x.score++;else x.wrong.push(xq.id);render();return;}
  if(d.xnext){var x2=ui.xq;x2.i++;x2.ans=null;if(x2.i>=x2.qs.length&&(!S.bestX||x2.score>S.bestX.s)){S.bestX={s:x2.score,n:x2.qs.length};save();}render();window.scrollTo(0,0);return;}
  if(d.newx){ui.xq=null;render();window.scrollTo(0,0);return;}
});
app.addEventListener("input",function(e){
  if(e.target.id==="q"){ui.search=e.target.value;document.getElementById("results").innerHTML=homeList();}
});
window.addEventListener("hashchange",function(){ui.detail=null;ui.practice=null;render();});
render();
})();
